services:
  - type: web
    name: skyguard-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: ML_SERVICE_URL
        fromService:
          name: skyguard-ml-service
          type: web
          property: host
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_CHAT_ID
        value: ""
      - key: TELEGRAM_CONFIDENCE_THRESHOLD
        value: "0.75"

  - type: web
    name: skyguard-ml-service
    runtime: docker
    rootDir: ml-service
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ML_HOST
        value: "0.0.0.0"
      - key: ML_PORT
        value: "8000"
      - key: ENABLE_LSTM
        value: "false"   # Disable LSTM to stay within 512 MB free-tier RAM

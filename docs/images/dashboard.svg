  <rect x="280" y="70" width="580" height="380" rx="8" fill="#0f2240" stroke="#17abc0" stroke-width="1"/>
  <text x="560" y="98" fill="#17abc0" font-size="13" text-anchor="middle">STATION MAP — NORTH INDIA</text>
  <!-- Map dots -->
  <circle cx="420" cy="220" r="14" fill="#ff4444" stroke="#fff" stroke-width="2"/>
  <text x="420" y="254" fill="#ff8888" font-size="11" text-anchor="middle">AWS001</text>
  <circle cx="530" cy="210" r="8" fill="#17abc0"/>
  <text x="530" y="232" fill="#8ab" font-size="11" text-anchor="middle">AWS002</text>
  <circle cx="390" cy="290" r="8" fill="#17abc0"/>
  <text x="390" y="312" fill="#8ab" font-size="11" text-anchor="middle">AWS003</text>
  <circle cx="480" cy="300" r="12" fill="#ff9900"/>
  <text x="480" y="324" fill="#ffaa44" font-size="11" text-anchor="middle">AWS004</text>
  <circle cx="560" cy="260" r="8" fill="#17abc0"/>
  <text x="560" y="282" fill="#8ab" font-size="11" text-anchor="middle">AWS005</text>


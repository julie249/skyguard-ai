  <polyline points="810,640 840,520" fill="none" stroke="#ff4444" stroke-width="2.5" stroke-dasharray="6,3"/>
  <circle cx="840" cy="520" r="5" fill="#ff4444"/>
  <text x="845" y="516" fill="#ff4444" font-size="11">52.5°C spike</text>
  <text x="313" y="698" fill="#8ab" font-size="10">Time →</text>

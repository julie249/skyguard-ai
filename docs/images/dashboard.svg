  <line x1="310" y1="690" x2="310" y2="500" stroke="#8ab" stroke-width="1"/>
  <!-- Normal readings line -->
  <polyline points="310,660 360,655 410,650 460,648 510,652 560,656 610,650 660,654 710,648 760,642 810,640" fill="none" stroke="#17abc0" stroke-width="2"/>

  <text x="894" y="162" fill="#8ab" font-size="10">Confidence: 0.94</text>
  <text x="894" y="178" fill="#8ab" font-size="10">Neighbors: 29°C avg — no agreement</text>
  <text x="894" y="194" fill="#17abc0" font-size="10">Corrected: 27.9°C (self-healed)</text>
  <text x="894" y="228" fill="#888" font-size="10">2 minutes ago</text>

  <rect x="880" y="248" width="300" height="110" rx="6" fill="#ff9900" opacity="0.15" stroke="#ff9900" stroke-width="1"/>
  <text x="894" y="268" fill="#ffaa44" font-size="12" font-weight="bold">GENUINE_EXTREME</text>

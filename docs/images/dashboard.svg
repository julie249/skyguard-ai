  <text x="894" y="302" fill="#8ab" font-size="10">Confidence: 0.87</text>
  <text x="894" y="318" fill="#8ab" font-size="10">Neighbors confirm · heatwave alert</text>
  <text x="894" y="348" fill="#888" font-size="10">45 minutes ago</text>

<svg viewBox="0 0 1100 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="1100" height="500" fill="#0d1b2a"/>
  <text x="550" y="38" fill="#17abc0" font-size="18" font-weight="bold" text-anchor="middle">SkyGuard AI — System Architecture</text>

  <!-- Arrow helper -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#17abc0"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#aaa"/>
    </marker>
  </defs>

  <!-- ESP32 Edge -->
  <rect x="20" y="150" width="150" height="80" rx="10" fill="#0f2240" stroke="#17abc0" stroke-width="1.5"/>
  <text x="95" y="183" fill="#17abc0" font-size="13" font-weight="bold" text-anchor="middle">ESP32 Edge</text>
  <text x="95" y="200" fill="#8ab" font-size="11" text-anchor="middle">MicroPython</text>
  <text x="95" y="216" fill="#8ab" font-size="11" text-anchor="middle">Z-score gate</text>
  <line x1="170" y1="190" x2="225" y2="190" stroke="#17abc0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="197" y="183" fill="#8ab" font-size="10" text-anchor="middle">HTTP</text>

  <!-- AWS Stations box -->
  <rect x="20" y="280" width="150" height="60" rx="10" fill="#0f2240" stroke="#888" stroke-width="1"/>
  <text x="95" y="307" fill="#888" font-size="12" text-anchor="middle">AWS Stations</text>
  <text x="95" y="323" fill="#666" font-size="10" text-anchor="middle">1,000+ India IMD</text>
  <line x1="170" y1="310" x2="225" y2="230" stroke="#aaa" stroke-width="1" marker-end="url(#arr2)"/>

  <!-- Backend -->
  <rect x="230" y="130" width="200" height="160" rx="10" fill="#0f2240" stroke="#17abc0" stroke-width="2"/>
  <text x="330" y="160" fill="#17abc0" font-size="14" font-weight="bold" text-anchor="middle">Node.js Fastify</text>
  <text x="330" y="178" fill="#17abc0" font-size="11" text-anchor="middle">Backend :3000</text>
  <text x="330" y="200" fill="#8ab" font-size="11" text-anchor="middle">REST API</text>
  <text x="330" y="216" fill="#8ab" font-size="11" text-anchor="middle">WebSocket stream</text>
  <text x="330" y="232" fill="#8ab" font-size="11" text-anchor="middle">Prisma ORM</text>
  <text x="330" y="248" fill="#8ab" font-size="11" text-anchor="middle">Alert dispatch</text>
  <text x="330" y="276" fill="#17abc0" font-size="11" text-anchor="middle">Never drops readings</text>

  <!-- DB -->
  <rect x="230" y="330" width="200" height="60" rx="10" fill="#0f2240" stroke="#888" stroke-width="1"/>
  <text x="330" y="357" fill="#888" font-size="12" text-anchor="middle">SQLite / TimescaleDB</text>
  <text x="330" y="374" fill="#666" font-size="10" text-anchor="middle">Readings + Alerts</text>
  <line x1="330" y1="295" x2="330" y2="328" stroke="#aaa" stroke-width="1" marker-end="url(#arr2)"/>

  <!-- ML service arrows -->
  <line x1="435" y1="190" x2="490" y2="190" stroke="#17abc0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="462" y="183" fill="#8ab" font-size="10" text-anchor="middle">/predict</text>

  <!-- ML Service -->
  <rect x="495" y="80" width="220" height="260" rx="10" fill="#0f2240" stroke="#17abc0" stroke-width="2"/>
  <text x="605" y="110" fill="#17abc0" font-size="14" font-weight="bold" text-anchor="middle">Python FastAPI</text>
  <text x="605" y="128" fill="#17abc0" font-size="11" text-anchor="middle">ML Service :8000</text>
  <text x="605" y="155" fill="#8ab" font-size="11" text-anchor="middle">Statistical Z+IQR</text>
  <text x="605" y="173" fill="#8ab" font-size="11" text-anchor="middle">Isolation Forest</text>
  <text x="605" y="191" fill="#8ab" font-size="11" text-anchor="middle">PyTorch LSTM</text>
  <text x="605" y="209" fill="#8ab" font-size="11" text-anchor="middle">Hybrid Ensemble</text>
  <text x="605" y="232" fill="#8ab" font-size="11" text-anchor="middle">Haversine Spatial</text>
  <text x="605" y="250" fill="#8ab" font-size="11" text-anchor="middle">SHAP Explainability</text>
  <text x="605" y="273" fill="#8ab" font-size="11" text-anchor="middle">Root Cause Classifier</text>
  <text x="605" y="323" fill="#17abc0" font-size="11" text-anchor="middle">Stateless — restarts safely</text>

  <!-- Response arrow -->
  <line x1="490" y1="210" x2="435" y2="210" stroke="#17abc0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="462" y="225" fill="#8ab" font-size="10" text-anchor="middle">PredictResponse</text>

  <!-- Frontend arrow -->
  <line x1="720" y1="190" x2="790" y2="190" stroke="#17abc0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="755" y="183" fill="#8ab" font-size="10" text-anchor="middle">WS/REST</text>

  <!-- Frontend -->
  <rect x="795" y="110" width="200" height="180" rx="10" fill="#0f2240" stroke="#17abc0" stroke-width="2"/>
  <text x="895" y="140" fill="#17abc0" font-size="14" font-weight="bold" text-anchor="middle">React + Vite</text>
  <text x="895" y="158" fill="#17abc0" font-size="11" text-anchor="middle">Dashboard :5173</text>
  <text x="895" y="183" fill="#8ab" font-size="11" text-anchor="middle">Station Map (Leaflet)</text>
  <text x="895" y="201" fill="#8ab" font-size="11" text-anchor="middle">Time-series Charts</text>
  <text x="895" y="219" fill="#8ab" font-size="11" text-anchor="middle">Alert Feed</text>
  <text x="895" y="237" fill="#8ab" font-size="11" text-anchor="middle">SHAP Card</text>
  <text x="895" y="260" fill="#8ab" font-size="11" text-anchor="middle">Live WebSocket</text>

  <!-- Telegram -->
  <rect x="230" y="420" width="200" height="55" rx="10" fill="#0f2240" stroke="#888" stroke-width="1"/>
  <text x="330" y="445" fill="#888" font-size="12" text-anchor="middle">Telegram Bot</text>
  <text x="330" y="462" fill="#666" font-size="10" text-anchor="middle">Alert dispatch (optional)</text>
  <line x1="330" y1="295" x2="330" y2="418" stroke="#aaa" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr2)"/>

  <!-- Legend -->
  <rect x="20" y="430" width="180" height="55" rx="6" fill="#0f2240" stroke="#333"/>
  <line x1="30" y1="448" x2="60" y2="448" stroke="#17abc0" stroke-width="2"/>
  <text x="65" y="452" fill="#8ab" font-size="10">Critical data path</text>
  <line x1="30" y1="468" x2="60" y2="468" stroke="#aaa" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="65" y="472" fill="#8ab" font-size="10">Optional / secondary</text>
</svg>

<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="1000" height="600" fill="#0d1b2a"/>
  <text x="500" y="40" fill="#17abc0" font-size="20" font-weight="bold" text-anchor="middle">SkyGuard AI — SHAP Explainability Card</text>

  <!-- Alert box -->
  <rect x="20" y="60" width="460" height="120" rx="8" fill="#ff4444" opacity="0.2" stroke="#ff4444" stroke-width="1.5"/>
  <text x="40" y="88" fill="#ff8888" font-size="16" font-weight="bold">SENSOR_FAULT</text>
  <text x="40" y="110" fill="#fff" font-size="13">Station: AWS001 (Delhi IGI Airport)</text>
  <text x="40" y="130" fill="#fff" font-size="13">Reading: 52.5°C  |  Confidence: 0.94</text>
  <text x="40" y="152" fill="#17abc0" font-size="13">Corrected estimate: 27.9°C (spatial avg)</text>
  <text x="40" y="172" fill="#888" font-size="11">Detected at 2026-11-17 14:23:11 UTC</text>

  <!-- SHAP bar chart -->
  <rect x="20" y="200" width="460" height="360" rx="8" fill="#0f2240" stroke="#17abc0" stroke-width="1"/>
  <text x="250" y="228" fill="#17abc0" font-size="14" font-weight="bold" text-anchor="middle">SHAP Feature Contributions</text>

  <!-- Feature bars -->
  <!-- temperature_z_score (highest) -->
  <text x="30" y="265" fill="#8ab" font-size="12">temperature_z_score</text>
  <rect x="210" y="250" width="220" height="20" rx="3" fill="#ff4444" opacity="0.9"/>
  <text x="435" y="265" fill="#ff8888" font-size="11">+6.75</text>

  <!-- pressure_z_score -->
  <text x="30" y="305" fill="#8ab" font-size="12">pressure_z_score</text>
  <rect x="210" y="290" width="30" height="20" rx="3" fill="#17abc0" opacity="0.7"/>
  <text x="245" y="305" fill="#17abc0" font-size="11">+0.21</text>

  <!-- humidity_z_score -->
  <text x="30" y="345" fill="#8ab" font-size="12">humidity_z_score</text>
  <rect x="180" y="330" width="28" height="20" rx="3" fill="#ff9900" opacity="0.7"/>
  <text x="145" y="345" fill="#ffaa44" font-size="11" text-anchor="end">-0.18</text>

  <!-- hour_of_day -->
  <text x="30" y="385" fill="#8ab" font-size="12">hour_of_day</text>
  <rect x="210" y="370" width="12" height="20" rx="3" fill="#17abc0" opacity="0.5"/>
  <text x="225" y="385" fill="#8ab" font-size="11">+0.08</text>

  <!-- Base value line -->
  <line x1="210" y1="248" x2="210" y2="440" stroke="#aaa" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="210" y="460" fill="#888" font-size="10" text-anchor="middle">base value</text>

  <!-- Summary -->
  <rect x="20" y="490" width="460" height="58" rx="6" fill="#0f2240" stroke="#888" stroke-width="1"/>
  <text x="40" y="512" fill="#17abc0" font-size="12" font-weight="bold">Root Cause:</text>
  <text x="40" y="532" fill="#fff" font-size="12">Temperature 6.75σ above seasonal mean. Spatial check: 3</text>
  <text x="40" y="548" fill="#fff" font-size="12">neighbours within 25km show 28–31°C. No agreement → SENSOR_FAULT.</text>

  <!-- Spatial panel -->
  <rect x="500" y="60" width="480" height="490" rx="8" fill="#0f2240" stroke="#17abc0" stroke-width="1"/>
  <text x="740" y="88" fill="#17abc0" font-size="14" font-weight="bold" text-anchor="middle">Spatial Corroboration</text>

  <!-- Target station -->
  <circle cx="740" cy="230" r="30" fill="#ff4444" opacity="0.9" stroke="#fff" stroke-width="2"/>
  <text x="740" y="225" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">AWS001</text>
  <text x="740" y="241" fill="#fff" font-size="10" text-anchor="middle">52.5°C ⚠</text>

  <!-- Neighbour stations -->
  <line x1="740" y1="230" x2="620" y2="160" stroke="#17abc0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="620" cy="150" r="20" fill="#17abc0" opacity="0.8"/>
  <text x="620" y="145" fill="#fff" font-size="10" text-anchor="middle">AWS002</text>
  <text x="620" y="160" fill="#fff" font-size="10" text-anchor="middle">29.1°C</text>

  <line x1="740" y1="230" x2="860" y2="170" stroke="#17abc0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="860" cy="160" r="20" fill="#17abc0" opacity="0.8"/>
  <text x="860" y="155" fill="#fff" font-size="10" text-anchor="middle">AWS003</text>
  <text x="860" y="170" fill="#fff" font-size="10" text-anchor="middle">30.3°C</text>

  <line x1="740" y1="230" x2="680" y2="330" stroke="#17abc0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="680" cy="345" r="20" fill="#17abc0" opacity="0.8"/>
  <text x="680" y="340" fill="#fff" font-size="10" text-anchor="middle">AWS005</text>
  <text x="680" y="355" fill="#fff" font-size="10" text-anchor="middle">28.7°C</text>

  <!-- Agreement score -->
  <rect x="520" y="400" width="440" height="60" rx="6" fill="#0d1b2a" stroke="#ff4444" stroke-width="1.5"/>
  <text x="740" y="422" fill="#ff8888" font-size="13" text-anchor="middle" font-weight="bold">Spatial Agreement Score: 0.04 (very low)</text>
  <text x="740" y="445" fill="#fff" font-size="12" text-anchor="middle">3 neighbours avg: 29.4°C vs reported 52.5°C</text>

  <!-- Self-heal box -->
  <rect x="520" y="478" width="440" height="50" rx="6" fill="#17abc0" opacity="0.2" stroke="#17abc0" stroke-width="1"/>
  <text x="740" y="498" fill="#17abc0" font-size="13" text-anchor="middle" font-weight="bold">Self-Healed Correction Applied</text>
  <text x="740" y="518" fill="#fff" font-size="12" text-anchor="middle">Corrected value: 27.9°C (inverse-distance weighted avg)</text>
</svg>
